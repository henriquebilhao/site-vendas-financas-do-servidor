<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finanças do Servidor - Assistente Financeiro no WhatsApp</title>
    <meta name="description" content="Assistente financeiro inteligente no WhatsApp. Registre despesas e receitas por texto, áudio, foto ou PDF e acompanhe tudo em um dashboard em tempo real." />
    <meta property="og:title" content="Finanças do Servidor - Assistente Financeiro no WhatsApp" />
    <meta property="og:description" content="Assistente financeiro inteligente no WhatsApp. Registre despesas e receitas por texto, áudio, foto ou PDF e acompanhe tudo em um dashboard em tempo real." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Meta Pixel Code -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '1107372538861247');
      fbq('init', '29164348889873811');
      fbq('track', 'PageView');
      // Eventos por clique (vale para todos os botões, sem mexer nos componentes):
      // link da Hotmart = InitiateCheckout; link do WhatsApp = Lead (teste grátis).
      document.addEventListener('click', function (ev) {
        var a = ev.target && ev.target.closest ? ev.target.closest('a[href]') : null;
        if (!a) return;
        var h = a.getAttribute('href') || '';
        if (h.indexOf('pay.hotmart.com') !== -1) {
          fbq('track', 'InitiateCheckout', { currency: 'BRL' });
        } else if (h.indexOf('wa.me/') !== -1) {
          fbq('track', 'Lead');
        }
      }, true);
    </script>
    <noscript><img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=1107372538861247&ev=PageView&noscript=1" />
      <img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=29164348889873811&ev=PageView&noscript=1" /></noscript>
    <!-- End Meta Pixel Code -->
  </head>
  <body class="bg-black text-slate-100 antialiased selection:bg-amber-400 selection:text-black">
    <div id="root">
      <!-- Topo estático: aparece antes do JavaScript. Manter o texto igual ao Hero (src/landing/Hero.tsx). -->
      <div class="min-h-screen bg-navy-900 font-sans text-slate-100">
        <div class="flex h-16 items-center gap-2.5 border-b border-white/5 bg-navy-950 px-4 sm:px-6">
          <img src="/logo.png" alt="" width="34" height="34" class="rounded-lg" />
          <span class="font-display text-[17px] font-bold tracking-tight text-white">Finanças do Servidor</span>
        </div>
        <div class="mx-auto max-w-7xl px-4 pt-12 text-center sm:px-6 sm:pt-16 lg:text-left">
          <h1 class="font-display text-[2.5rem] font-bold leading-[1.05] tracking-tight text-white text-balance sm:text-6xl lg:text-[4.2rem]">
            Seu salário organizado começa numa
            <span class="bg-gradient-to-r from-amber-300 via-yellow-300 to-amber-500 bg-clip-text text-transparent">mensagem.</span>
          </h1>
          <p class="mx-auto mt-6 max-w-xl text-lg leading-relaxed text-slate-300 lg:mx-0">
            Mande um texto, um áudio, a foto da nota fiscal ou um PDF no WhatsApp. O assistente registra cada gasto e cada extra, e você
            sabe quanto sobra, mesmo na correria do dia a dia.
          </p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
